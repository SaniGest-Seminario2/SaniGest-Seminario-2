name: Set up Maven and Java
description: Install the Java toolchain and cache Maven dependencies
inputs:
  cache-dependency-path:
    description: Files that identify the Maven dependency cache
    default: |
      pom.xml
      **/pom.xml
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

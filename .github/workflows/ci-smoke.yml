name: Application Smoke CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: application-smoke-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-smoke:
    name: Application smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Package executable applications
        run: mvn -B -DskipTests package

      - name: Smoke test generic Spring Boot template
        run: |
          sh scripts/qa/smoke-spring-boot-service.sh \
            templates/spring-boot-service/target/spring-boot-service-template-0.1.0-SNAPSHOT.jar \
            spring-boot-service-template \
            "Spring Boot Service Template"

      - name: Smoke test Company Service
        run: sh scripts/qa/smoke-company-service.sh

      - name: Smoke test Identity Service
        run: sh scripts/qa/smoke-identity-service.sh

      - name: Upload application logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: application-smoke-logs-${{ github.run_id }}
          path: "**/target/*.log"
          if-no-files-found: ignore
          retention-days: 7

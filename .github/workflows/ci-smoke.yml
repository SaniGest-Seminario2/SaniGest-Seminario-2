name: Application Smoke CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: application-smoke-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-smoke:
    name: Application smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Run Java HTTP smoke scenarios
        run: mvn -B -Psmoke verify

      - name: Publish smoke scenario reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-smoke-reports-${{ github.run_id }}
          path: "**/target/failsafe-reports/**"
          if-no-files-found: error
          retention-days: 7

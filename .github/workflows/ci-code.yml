name: Code CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway HTTP integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GATEWAY_ARTIFACT: api-gateway-integration-reports-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21 and Maven cache
        uses: ./.github/actions/setup-maven

      - name: Verify API Gateway against a local HTTP backend
        id: gateway
        run: >-
          sh scripts/ci/run-stage.sh 'API Gateway' 'HTTP integration tests'
          sh scripts/ci/maven-build.sh -Dspotless.skip=true -Dcheckstyle.skip=true -pl services/api-gateway -am -Pintegration-only verify

      - name: Validate and summarize Gateway integration reports
        if: ${{ !cancelled() && steps.gateway.outcome != '' }}
        env:
          OUTCOME: ${{ steps.gateway.outcome }}
        run: python3 scripts/ci/report.py 'API Gateway' gateway "$OUTCOME" "$GATEWAY_ARTIFACT" services/api-gateway

      - name: Publish Gateway integration reports
        if: ${{ !cancelled() && steps.gateway.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GATEWAY_ARTIFACT }}
          path: services/api-gateway/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

  finance:
    name: Finance projection integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-maven
      - name: Verify snapshot and event isolation
        run: >-
          sh scripts/ci/maven-build.sh -Dspotless.skip=true -Dcheckstyle.skip=true
          -pl services/finance-service -am -Pintegration-only verify

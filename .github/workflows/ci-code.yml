name: Code CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: code-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    # Keep this name stable: it is the required status check in branch protection.
    name: Syntax and compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Validate format, static analysis and compilation
        run: sh config/maven-build.sh -DskipTests compile

  unit-tests:
    # Keep this name stable: it is a required status check in branch protection.
    name: Unit tests
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Run unit tests
        run: sh config/maven-build.sh -DskipITs test

      - name: Verify API Gateway against a local HTTP backend
        run: sh config/maven-build.sh -pl services/api-gateway -am verify

      - name: Publish unit and Gateway test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-${{ github.run_id }}
          path: |
            **/target/surefire-reports/**
            services/api-gateway/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Coverage gate
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Run unit tests with coverage
        run: sh config/maven-build.sh -Pcoverage -DskipITs verify

      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ github.run_id }}
          path: "**/target/site/jacoco/**"
          if-no-files-found: warn
          retention-days: 7

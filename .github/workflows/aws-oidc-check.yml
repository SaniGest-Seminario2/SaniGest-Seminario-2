name: Check AWS OIDC

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write

    steps:
      - name: Assume AWS dev role
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEV_REGION }}
          role-session-name: github-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Verify assumed identity
        run: aws sts get-caller-identity --no-cli-pager >/dev/null

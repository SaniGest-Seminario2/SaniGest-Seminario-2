name: Company Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "services/company-service/**"
      - "libraries/common-security/**"
      - "libraries/common-company-access/**"
      - "pom.xml"
      - "config/**"
      - "scripts/ci/**"
      - ".github/actions/setup-maven/**"
      - ".github/workflows/reusable-service-ci.yml"
      - ".github/workflows/ci-company-service.yml"

permissions:
  contents: read

concurrency:
  group: company-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Service checks keep their own context. Code CI owns shared-library tests and coverage.
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service: company-service

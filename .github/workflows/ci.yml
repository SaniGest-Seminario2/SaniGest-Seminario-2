name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Modules with unit tests and an instruction coverage gate.
  COVERED_MODULES: >-
    libraries/common-security libraries/common-company-access libraries/common-events libraries/common-web
    services/company-service services/identity-service
    services/catalog-service services/sales-service services/inventory-service
    services/expense-service services/finance-service

jobs:
  secrets:
    name: Versioned secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the complete history reachable from the build
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --gitleaks-ignore-path /repo/.gitleaksignore --verbose --redact=100 --no-banner --log-opts='HEAD --full-history -m' /repo

  dependencies:
    name: Runtime dependency scan
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-maven
        with:
          cache-scope: reactor-unit
      - name: Package the service runtime dependencies
        run: sh scripts/ci/maven-build.sh -Dmaven.test.skip=true -Dspotless.skip=true -Dcheckstyle.skip=true package
      - name: Scan executable service jars and block critical vulnerabilities
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-jars"
          for service in services/*/; do
            set -- "${service}target/"*.jar
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "::error::Expected exactly one runtime JAR under ${service}target/"
              exit 1
            fi
            cp "$1" "$RUNNER_TEMP/runtime-jars/"
          done
          set -- "$RUNNER_TEMP"/runtime-jars/*.jar
          docker run --rm -v "$RUNNER_TEMP/runtime-jars:/scan:ro" \
            ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            rootfs --no-progress --scanners vuln --pkg-types library --list-all-pkgs \
            --format json /scan > "$RUNNER_TEMP/runtime-vulnerabilities.json"
          jq -e --argjson expected "$#" '
            [.Results[]? | select(.Type == "jar") | .Packages[]?.FilePath
             | strings | select(contains("/BOOT-INF/lib/")) | split("/")[0]]
            | unique | length == $expected
          ' "$RUNNER_TEMP/runtime-vulnerabilities.json"
          jq -e '
            [.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")
             | {VulnerabilityID, PkgName, InstalledVersion, FixedVersion}]
            | unique | debug | length == 0
          ' "$RUNNER_TEMP/runtime-vulnerabilities.json"
      - name: Publish dependency scan
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-vulnerabilities
          path: ${{ runner.temp }}/runtime-vulnerabilities.json
          if-no-files-found: ignore

  syntax:
    name: Syntax and compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21 and Maven cache
        uses: ./.github/actions/setup-maven

      - name: Validate Maven configuration, format and static analysis
        run: sh scripts/ci/run-stage.sh 'Maven reactor' 'Configuration and static analysis' sh scripts/ci/maven-build.sh validate

      - name: Compile production sources
        run: >-
          sh scripts/ci/run-stage.sh 'Maven reactor' Compilation
          sh scripts/ci/maven-build.sh -Dspotless.skip=true -Dcheckstyle.skip=true compile

  # Branch protection matches these job names exactly. Keep them at the top level.
  unit-tests:
    name: Unit tests
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UNIT_ARTIFACT: unit-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
      COVERAGE_ARTIFACT: coverage-reports-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      maven: ${{ steps.unit.outcome }}
      reports: ${{ steps.coverage.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21 and Maven cache
        uses: ./.github/actions/setup-maven
        with:
          cache-scope: reactor-unit

      - name: Run unit tests and enforce JaCoCo coverage
        id: unit
        timeout-minutes: 6
        run: >-
          sh scripts/ci/run-stage.sh 'Maven reactor' 'Unit tests and coverage'
          sh scripts/ci/maven-build.sh -Dspotless.skip=true -Dcheckstyle.skip=true --fail-at-end -Pcoverage -DskipITs verify

      - name: Validate and summarize unit test reports
        if: ${{ !cancelled() && steps.unit.outcome != '' }}
        env:
          OUTCOME: ${{ steps.unit.outcome }}
        run: python3 scripts/ci/report.py 'Maven reactor' unit "$OUTCOME" "$UNIT_ARTIFACT" $COVERED_MODULES

      - name: Validate and summarize JaCoCo instruction coverage
        id: coverage
        if: ${{ !cancelled() && steps.unit.outcome != '' }}
        env:
          OUTCOME: ${{ steps.unit.outcome }}
        run: python3 scripts/ci/report.py 'Maven reactor' coverage "$OUTCOME" "$COVERAGE_ARTIFACT" $COVERED_MODULES

      - name: Publish unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UNIT_ARTIFACT }}
          path: |
            libraries/*/target/surefire-reports/
            services/*/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish JaCoCo XML and HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COVERAGE_ARTIFACT }}
          path: |
            libraries/*/target/site/jacoco/
            services/*/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Coverage gate
    needs: unit-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the upstream JaCoCo verdict and XML validation
        env:
          MAVEN: ${{ needs.unit-tests.outputs.maven }}
          REPORTS: ${{ needs.unit-tests.outputs.reports }}
        run: |
          if [ "$MAVEN" = success ] && [ "$REPORTS" = success ]; then
            printf '### Coverage gate\n\nPassed. See JaCoCo instruction coverage in **Unit tests**.\n' >> "$GITHUB_STEP_SUMMARY"
            echo '::notice::JaCoCo verification and XML validation passed.'
          else
            printf '### Coverage gate\n\nFailed or unavailable (Maven: %s, XML validation: %s). See **Unit tests**.\n' "${MAVEN:-unavailable}" "${REPORTS:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Coverage verification did not pass. See Unit tests for module results and the coverage-reports artifact.'
            exit 1
          fi

  code:
    needs: syntax
    uses: ./.github/workflows/ci-code.yml
  company:
    needs: syntax
    uses: ./.github/workflows/ci-company-service.yml
  identity:
    needs: syntax
    uses: ./.github/workflows/ci-identity-service.yml
  catalog:
    needs: syntax
    uses: ./.github/workflows/ci-catalog-service.yml
  sales:
    needs: syntax
    uses: ./.github/workflows/ci-sales-service.yml
  inventory:
    needs: syntax
    uses: ./.github/workflows/ci-inventory-service.yml
  infrastructure:
    needs: syntax
    uses: ./.github/workflows/ci-infrastructure.yml
  multi-company:
    name: Multi-company smoke through Gateway
    needs: syntax
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate OpenAPI and run the multi-company smoke
        env:
          VERIFY_OPENAPI: "true"
        run: |
          python3 -m venv "$RUNNER_TEMP/openapi-venv"
          export PATH="$RUNNER_TEMP/openapi-venv/bin:$PATH"
          export OPENAPI_OUTPUT="$RUNNER_TEMP/openapi"
          python -m pip install openapi-spec-validator==0.7.2
          sh infrastructure/qa/run-smoke-multi-company.sh
      - name: Block incompatible changes against main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          workflow="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs"
          run_id=$(gh api "$workflow?event=push&status=success&head_sha=$BASE_SHA" --jq '.workflow_runs[0].id // ""')
          artifact_id=
          if [ -n "$run_id" ]; then
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '.artifacts[] | select(.name == "openapi-contracts" and (.expired | not)) | .id')
          fi
          if [ -z "$artifact_id" ]; then
            echo "::notice::The base revision has no validated OpenAPI artifact yet."
            exit 0
          fi
          gh run download "$run_id" --name openapi-contracts --dir "$RUNNER_TEMP/openapi-base"
          archive="$RUNNER_TEMP/oasdiff_1.41.0_linux_amd64.tar.gz"
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.41.0/oasdiff_1.41.0_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' 96365453163118e6503eb71742643d9ee67f91aedbaadd1a1ce9c6213e3b71c7 "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" oasdiff
          for baseline in "$RUNNER_TEMP/openapi-base/"*.json; do
            if [ "${baseline##*/}" = sales.json ]; then
              # S2-483 requires explicit unit prices for newly created invoices.
              printf '%s\n' 'POST /api/v1/invoices the request property `lines/items/unitPrice` became required' \
                > "$RUNNER_TEMP/sales-oasdiff-err-ignore"
              set -- --err-ignore "$RUNNER_TEMP/sales-oasdiff-err-ignore"
            else
              set --
            fi
            "$RUNNER_TEMP/oasdiff" breaking "$baseline" "$RUNNER_TEMP/openapi/${baseline##*/}" --fail-on ERR "$@"
          done
      - name: Publish the validated contracts
        uses: actions/upload-artifact@v7
        with:
          name: openapi-contracts
          path: ${{ runner.temp }}/openapi
  required:
    name: CI required
    if: ${{ always() }}
    needs: [syntax, unit-tests, coverage, code, company, identity, catalog, sales, inventory, infrastructure, multi-company, secrets, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - name: Verify all CI stages passed
        run: jq -e 'all(.[]; . == "success")' <<< "$RESULTS"

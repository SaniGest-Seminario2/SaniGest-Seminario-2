name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    # Keep this name stable: it is the required status check in branch protection.
    name: Syntax and compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Validate format, static analysis and compilation
        run: mvn -B -DskipTests compile

  unit-tests:
    name: Unit tests
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Run unit tests and Maven verification
        run: mvn -B verify

      - name: Smoke test generic Spring Boot template
        run: |
          sh scripts/qa/smoke-spring-boot-service.sh \
            templates/spring-boot-service/target/spring-boot-service-template-0.1.0-SNAPSHOT.jar \
            spring-boot-service-template \
            "Spring Boot Service Template"

      - name: Smoke test Company Service consumer
        run: sh scripts/qa/smoke-company-service.sh

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  infrastructure-smoke:
    name: Infrastructure smoke tests
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose contract
        run: sh scripts/qa/validate-compose.sh

      - name: Verify PostgreSQL, Valkey and Kafka runtime behavior
        run: sh scripts/qa/smoke-infrastructure.sh

      - name: Build application images
        run: docker compose --env-file .env.example --profile apps build company-service


name: Identity Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "services/identity-service/**"
      - "libraries/common-security/**"
      - "pom.xml"
      - "config/**"
      - "scripts/ci/**"
      - ".github/actions/setup-maven/**"
      - ".github/workflows/reusable-service-ci.yml"
      - ".github/workflows/ci-identity-service.yml"

permissions:
  contents: read

concurrency:
  group: identity-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Service checks keep their own context. Code CI owns shared-library tests and coverage.
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service: identity-service

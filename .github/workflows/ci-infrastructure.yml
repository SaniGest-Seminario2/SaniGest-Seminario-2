name: Infrastructure CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-smoke:
    name: Infrastructure smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose contract
        run: >-
          sh scripts/ci/run-stage.sh Infrastructure 'Docker Compose contract'
          sh infrastructure/qa/validate-compose.sh

      - name: Verify PostgreSQL, Valkey and Kafka runtime behavior
        run: >-
          sh scripts/ci/run-stage.sh Infrastructure 'PostgreSQL, Valkey and Kafka runtime'
          sh infrastructure/qa/smoke-infrastructure.sh

  application-images:
    name: Build application images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build application images
        run: |
          sh scripts/ci/run-stage.sh Infrastructure 'Build Company, Identity, Catalog and Sales images' \
            docker compose --env-file .env.example --profile apps --progress plain build \
            company-service identity-service catalog-service sales-service

name: Sales Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "services/sales-service/**"
      - "libraries/common-security/**"
      - "libraries/common-company-access/**"
      - "pom.xml"
      - "config/**"
      - "infrastructure/postgres/init/**"
      - "infrastructure/docker/service.Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/ci/**"
      - ".github/actions/setup-maven/**"
      - ".github/workflows/reusable-service-ci.yml"
      - ".github/workflows/ci-sales-service.yml"

permissions:
  contents: read

concurrency:
  group: sales-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service: sales-service

services:
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: api-gateway
    profiles: [apps]
    environment:
      SANIGEST_OPENAPI_ENABLED: ${SANIGEST_OPENAPI_ENABLED:-true}
      JWT_ISSUER: ${JWT_ISSUER:-sanigest}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sanigest-api}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt-public.pem
      IDENTITY_SERVICE_URL: http://identity-service:8080
      COMPANY_SERVICE_URL: http://company-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      EXPENSE_SERVICE_URL: http://expense-service:8080
      SALES_SERVICE_URL: http://sales-service:8080
      FINANCE_SERVICE_URL: http://finance-service:8080
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:8080}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8085}:8080"
    volumes:
      - ${JWT_PUBLIC_KEY_FILE:-./.secrets/jwt-public.pem}:/run/secrets/jwt-public.pem:ro
    depends_on:
      identity-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      expense-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [sanigest-local]

  company-service:
    environment:
      COMPANY_MULTIPLE_MEMBERSHIPS_ENABLED: ${COMPANY_MULTIPLE_MEMBERSHIPS_ENABLED:-false}
      SPRING_APPLICATION_JSON: >-
        {"sanigest":{"company-access":{"callers":{"catalog":{"issuer":"catalog-company-access","public-key":"file:/run/secrets/catalog-company-public.pem"},
        "inventory":{"issuer":"inventory-company-access","public-key":"file:/run/secrets/inventory-company-public.pem"},
        "sales":{"issuer":"sales-company-access","public-key":"file:/run/secrets/sales-company-public.pem"},
        "expense":{"issuer":"expense-company-access","public-key":"file:/run/secrets/expense-company-public.pem"},
        "finance":{"issuer":"finance-company-access","public-key":"file:/run/secrets/finance-company-public.pem"}}}}}
    volumes:
      - ${COMPANY_ACCESS_KEYS_DIR:-./.secrets}/sales-company-public.pem:/run/secrets/sales-company-public.pem:ro
      - ${COMPANY_ACCESS_KEYS_DIR:-./.secrets}/expense-company-public.pem:/run/secrets/expense-company-public.pem:ro
      - ${COMPANY_ACCESS_KEYS_DIR:-./.secrets}/finance-company-public.pem:/run/secrets/finance-company-public.pem:ro

  catalog-service:
    environment:
      SPRING_APPLICATION_JSON: >-
        {"sanigest":{"company-access":{"enabled":true,"origin":"http://company-service:8080",
        "issuer":"catalog-company-access","private-key-location":"file:/run/secrets/catalog-company-private.pem"}}}
    volumes:
      - ${COMPANY_ACCESS_KEYS_DIR:-./.secrets}/catalog-company-private.pem:/run/secrets/catalog-company-private.pem:ro

  sales-service:
    environment:
      SALES_COMPANY_ACCESS_ENABLED: "true"
      SALES_COMPANY_ACCESS_ORIGIN: http://company-service:8080
      SALES_COMPANY_ACCESS_PRIVATE_KEY_LOCATION: file:/run/secrets/sales-company-private.pem
    volumes:
      - ${COMPANY_ACCESS_KEYS_DIR:-./.secrets}/sales-company-private.pem:/run/secrets/sales-company-private.pem:ro

  expense-service:
    environment:
      SPRING_PROFILES_ACTIVE: local
      EXPENSE_COMPANY_ACCESS_ENABLED: "true"
      EXPENSE_COMPANY_ACCESS_ORIGIN: http://company-service:8080
      EXPENSE_COMPANY_ACCESS_PRIVATE_KEY_LOCATION: file:/run/secrets/expense-company-private.pem
    volumes:
      - ${COMPANY_ACCESS_KEYS_DIR:-./.secrets}/expense-company-private.pem:/run/secrets/expense-company-private.pem:ro

  finance-service:
    environment:
      SPRING_PROFILES_ACTIVE: local
      FINANCE_COMPANY_ACCESS_ENABLED: "true"
      FINANCE_COMPANY_ACCESS_ORIGIN: http://company-service:8080
      FINANCE_COMPANY_ACCESS_PRIVATE_KEY_LOCATION: file:/run/secrets/finance-company-private.pem
    volumes:
      - ${COMPANY_ACCESS_KEYS_DIR:-./.secrets}/finance-company-private.pem:/run/secrets/finance-company-private.pem:ro

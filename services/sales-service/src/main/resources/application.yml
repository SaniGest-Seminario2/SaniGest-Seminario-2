spring:
  application:
    name: sales-service
  datasource:
    url: jdbc:postgresql://${SALES_DB_HOST}:${SALES_DB_PORT:5432}/sanigest_sales
    username: sanigest_sales
    password: ${SALES_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      connection-init-sql: >-
        DO $sales$
        BEGIN
          IF current_database() <> 'sanigest_sales' OR session_user <> 'sanigest_sales'
             OR current_user <> 'sanigest_sales' THEN
            RAISE EXCEPTION 'Sales requires the sanigest_sales database and role';
          END IF;
        END;
        $sales$;
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: sales
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    read:
      strict-duplicate-detection: true
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  port: ${SERVER_PORT:${SALES_SERVICE_PORT:8084}}
  shutdown: graceful

sanigest:
  company-access:
    enabled: ${SALES_COMPANY_ACCESS_ENABLED:false}
    origin: ${SALES_COMPANY_ACCESS_ORIGIN:}
    issuer: ${SALES_COMPANY_ACCESS_ISSUER:sales-company-access}
    private-key-location: ${SALES_COMPANY_ACCESS_PRIVATE_KEY_LOCATION:}
    connect-timeout: ${SALES_COMPANY_ACCESS_CONNECT_TIMEOUT:500ms}
    response-timeout: ${SALES_COMPANY_ACCESS_RESPONSE_TIMEOUT:2s}
  catalog:
    origin: ${SALES_CATALOG_ORIGIN:}
    connect-timeout: ${SALES_CATALOG_CONNECT_TIMEOUT:500ms}
    response-timeout: ${SALES_CATALOG_RESPONSE_TIMEOUT:2s}
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    public-key: ${JWT_PUBLIC_KEY_LOCATION}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

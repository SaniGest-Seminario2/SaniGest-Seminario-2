openapi: 3.0.3
info:
  title: SaniGest Sales
  version: '1.0'
security:
  - bearerAuth: []
paths:
  /api/v1/sales/options:
    get:
      summary: Consultar opciones de Sales
      description: Requiere SALES_READ. Los filtros de factura y cartera son opciones de UI. PENDING representa
        OPEN en cartera. El comprobante solicitado es distinto de la clasificación fiscal de la factura interna.
        saleModeFilters corresponde a mode en el listado e invoiceTaxRates a taxRate de cada línea.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CompanySelector'
      responses:
        '200':
          description: Opciones disponibles
          content:
            application/json:
              schema:
                type: object
                required: [saleModes, requestedReceiptTypes, invoiceFilters, receivableFilters, paymentMethods, saleModeFilters, invoiceTaxRates]
                properties:
                  saleModes:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [CASH, CREDIT]}
                        label: {type: string}
                  requestedReceiptTypes:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [CONSUMPTION, FISCAL_CREDIT]}
                        label: {type: string}
                  invoiceFilters:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [ALL, ISSUED, PARTIALLY_PAID, PAID]}
                        label: {type: string}
                  receivableFilters:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [ALL, PENDING, PARTIALLY_PAID]}
                        label: {type: string}
                  paymentMethods:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [CASH, CREDIT_CARD, DEBIT_CARD, TRANSFER, CHECK]}
                        label: {type: string}
                  saleModeFilters:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [ALL, CASH, CREDIT]}
                        label: {type: string}
                  invoiceTaxRates:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: number, enum: [0.18, 0.16, 0]}
                        label: {type: string}
              example:
                saleModes:
                  - {value: CASH, label: "Contado"}
                  - {value: CREDIT, label: "Crédito"}
                requestedReceiptTypes:
                  - {value: CONSUMPTION, label: "Consumidor final"}
                  - {value: FISCAL_CREDIT, label: "Crédito fiscal"}
                invoiceFilters:
                  - {value: ALL, label: "Todos"}
                  - {value: ISSUED, label: "Emitida"}
                  - {value: PARTIALLY_PAID, label: "Parcialmente pagada"}
                  - {value: PAID, label: "Pagada"}
                receivableFilters:
                  - {value: ALL, label: "Todos"}
                  - {value: PENDING, label: "Pendiente"}
                  - {value: PARTIALLY_PAID, label: "Parcial"}
                paymentMethods:
                  - {value: CASH, label: "Efectivo"}
                  - {value: CREDIT_CARD, label: "Tarjeta de crédito"}
                  - {value: DEBIT_CARD, label: "Tarjeta de débito"}
                  - {value: TRANSFER, label: "Transferencia"}
                  - {value: CHECK, label: "Cheque"}
                saleModeFilters:
                  - {value: ALL, label: "Todas"}
                  - {value: CASH, label: "Contado"}
                  - {value: CREDIT, label: "Crédito"}
                invoiceTaxRates:
                  - {value: 0.18, label: "18%"}
                  - {value: 0.16, label: "16%"}
                  - {value: 0, label: "0%/Exento"}
        '400':
          description: Parámetros inválidos
        '401':
          description: JWT inválido o ausente
        '403':
          description: Permiso empresarial insuficiente
        '503':
          description: Autorización no disponible
  /api/v1/sales:
    parameters:
      - $ref: '#/components/parameters/CompanySelector'
    get:
      summary: Lista ventas de la empresa con SALES_READ.
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 250}}
        - {name: status, in: query, schema: {type: string, enum: [ALL, REGISTERED, CANCELLED]}}
        - {name: mode, in: query, schema: {type: string, enum: [ALL, CASH, CREDIT]}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SalePage'}
        '400': {$ref: '#/components/responses/InvalidContext'}
        '401': {description: JWT inválido o ausente.}
        '403': {description: Permiso empresarial insuficiente.}
        '404': {description: Recurso ausente o fuera de la empresa autorizada.}
        '503': {description: Autorización o dependencia indisponible.}
  /api/v1/sales/{id}:
    parameters:
      - $ref: '#/components/parameters/CompanySelector'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Consulta una venta con SALES_READ.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleDetail'}
        '400': {$ref: '#/components/responses/InvalidContext'}
        '401': {description: JWT inválido o ausente.}
        '403': {description: Permiso empresarial insuficiente.}
        '404': {description: Recurso ausente o fuera de la empresa autorizada.}
        '503': {description: Autorización o dependencia indisponible.}
  /api/v1/sales/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/CompanySelector'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Cancela una venta con SALES_CANCEL (OWNER o ADMIN).
      responses:
        '200': {description: Operación completada.}
        '400': {$ref: '#/components/responses/InvalidContext'}
        '401': {description: JWT inválido o ausente.}
        '403': {description: Permiso empresarial insuficiente.}
        '404': {description: Recurso ausente o fuera de la empresa autorizada.}
        '503': {description: Autorización o dependencia indisponible.}
  /api/v1/receivables/{id}:
    parameters:
      - $ref: '#/components/parameters/CompanySelector'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Consulta una cuenta por cobrar con SALES_READ.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceivableDetail'}
        '400': {$ref: '#/components/responses/InvalidContext'}
        '401': {description: JWT inválido o ausente.}
        '403': {description: Permiso empresarial insuficiente.}
        '404': {description: Recurso ausente o fuera de la empresa autorizada.}
        '503': {description: Autorización o dependencia indisponible.}
  /api/v1/invoices:
    get:
      summary: Lista facturas de la empresa con paginación y SALES_READ.
      parameters:
        - $ref: '#/components/parameters/CompanySelector'
        - $ref: '#/components/parameters/InvoiceSearch'
        - $ref: '#/components/parameters/InvoiceStatus'
        - $ref: '#/components/parameters/InvoicePageNumber'
        - $ref: '#/components/parameters/InvoicePageSize'
      responses:
        '200': {$ref: '#/components/responses/InvoicePage'}
    post:
      summary: Crea una factura interna multilínea con SALES_WRITE.
      description: >
        Registra la venta, la factura y la obligación positiva en una transacción.
        Aplica el precio y la tasa indicados en cada línea. Redondea a dos decimales la base después del descuento
        y calcula el ITBIS sobre esa base. La obligación CASH vence en la fecha comercial
        y la CREDIT usa dueDate. Los productos con seguimiento de stock se rechazan
        hasta habilitar la reserva de existencias. La misma clave y solicitud recuperan el mismo
        documento durante la ventana de idempotencia de Sales.
      parameters:
        - $ref: '#/components/parameters/CompanySelector'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._~-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, mode, lines]
              properties:
                clientId: {type: string, format: uuid}
                mode: {type: string, enum: [CASH, CREDIT]}
                issueDate:
                  type: string
                  format: date
                  description: Fecha comercial. Acepta saleDate como alias. Por defecto usa la fecha comercial actual.
                requestedReceiptType: {type: string, enum: [CONSUMPTION, FISCAL_CREDIT]}
                notes: {type: string, maxLength: 1000}
                dueDate:
                  type: string
                  format: date
                  description: Obligatoria para CREDIT y ausente para CASH.
                lines:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [catalogItemId, quantity, unitPrice]
                    properties:
                      catalogItemId: {type: string, format: uuid}
                      quantity: {type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.001}
                      unitPrice: {type: number, minimum: 0, multipleOf: 0.0001}
                      taxRate:
                        type: number
                        description: Fracción de ITBIS elegida para la línea. Usa los valores numéricos de invoiceTaxRates.
                        enum: [0, 0.16, 0.18]
                        default: 0
                      discount:
                        type: number
                        description: Descuento en DOP sobre el importe bruto de la línea.
                        minimum: 0
                        multipleOf: 0.01
                        default: 0
      responses:
        '201':
          description: Factura emitida o recuperada por idempotencia.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invoice'}
        '400': {description: "Selector, clave o cuerpo inválido."}
        '401': {description: JWT inválido o ausente.}
        '403': {description: Permiso empresarial insuficiente.}
        '404': {description: Cliente o artículo ausente o fuera de la empresa.}
        '409': {description: Conflicto de idempotencia o de registro.}
        '422': {description: "Cliente o artículo inactivo, o importes fuera de rango."}
        '503': {description: Autorización o dependencia indisponible.}
  /api/v1/invoices/all:
    get:
      summary: Lista todas las facturas que coinciden con la búsqueda.
      parameters:
        - $ref: '#/components/parameters/CompanySelector'
        - $ref: '#/components/parameters/InvoiceSearch'
        - $ref: '#/components/parameters/InvoiceStatus'
      responses:
        '200': {$ref: '#/components/responses/InvoiceList'}
        '422': {$ref: '#/components/responses/InvoiceListLimitExceeded'}
  /api/v1/invoices/collectible:
    get:
      summary: Lista facturas vigentes con saldo positivo y paginación.
      parameters:
        - $ref: '#/components/parameters/CompanySelector'
        - $ref: '#/components/parameters/InvoiceSearch'
        - $ref: '#/components/parameters/InvoiceStatus'
        - $ref: '#/components/parameters/InvoicePageNumber'
        - $ref: '#/components/parameters/InvoicePageSize'
      responses:
        '200': {$ref: '#/components/responses/InvoicePage'}
  /api/v1/invoices/collectible/all:
    get:
      summary: Lista todas las facturas cobrables que coinciden con la búsqueda.
      parameters:
        - $ref: '#/components/parameters/CompanySelector'
        - $ref: '#/components/parameters/InvoiceSearch'
        - $ref: '#/components/parameters/InvoiceStatus'
      responses:
        '200': {$ref: '#/components/responses/InvoiceList'}
        '422': {$ref: '#/components/responses/InvoiceListLimitExceeded'}
  /api/v1/invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/CompanySelector'
      - $ref: '#/components/parameters/InvoiceId'
    get:
      summary: Consulta una factura por ID con SALES_READ.
      responses:
        '200': {$ref: '#/components/responses/InvoiceDocument'}
        '404': {description: Factura ausente en la empresa.}
  /api/v1/invoices/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/CompanySelector'
      - $ref: '#/components/parameters/InvoiceId'
    post:
      summary: Anula la factura, la venta y la obligación abierta con SALES_CANCEL.
      description: Una anulación repetida devuelve la auditoría de la primera.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200': {$ref: '#/components/responses/InvoiceDocument'}
        '400': {description: ID o motivo inválido.}
        '403': {description: Permisos insuficientes.}
        '404': {description: Factura ausente en la empresa.}
        '409': {description: La obligación registra cobros.}
  /api/v1/sales/{saleId}/invoices:
    post:
      operationId: issueInternalInvoice
      summary: Emite manualmente una factura interna desde una venta
      description: |
        Requiere membresía empresarial activa con SALES_WRITE. OWNER y ADMIN tienen
        acceso. OPERATOR requiere concesión explícita. Este flujo usa membresía regular.
        La solicitud debe enviarse sin cuerpo. Un reintento autenticado y autorizado con
        la misma venta y clave devuelve el mismo HTTP 201 y documento.
        El documento INTERNAL / NOT_FISCAL no genera NCF y no es un comprobante
        válido para la DGII. La emisión no genera cobros, ingresos ni movimientos de caja.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanySelector'
        - name: saleId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: true
          description: Una sola clave por empresa, usuario y operación. Reutilizarla para otra venta devuelve 409.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{1,128}$'
      responses:
        '201':
          description: Factura interna emitida o respuesta idempotente recuperada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invoice'}
        '400':
          description: Selector, UUID, clave o cuerpo inválido.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401':
          description: JWT Bearer ausente o inválido.
        '403':
          description: Permiso empresarial insuficiente.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: Venta inexistente o fuera de la empresa autorizada.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: Venta no elegible, factura vigente o clave usada para otra venta.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: Autorización o snapshot empresarial indisponible.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/invoices/{id}/payments:
    post:
      operationId: registerInvoicePayment
      summary: Registrar un cobro de factura
      parameters:
        - $ref: '#/components/parameters/CompanySelector'
        - $ref: '#/components/parameters/InvoiceId'
        - in: header
          name: Idempotency-Key
          required: true
          description: >
            Clave por empresa, operador y operación. Repetir la misma factura y datos
            normalizados devuelve el 201 histórico. Otra factura o datos distintos devuelven 409.
          schema: {type: string, pattern: '^[A-Za-z0-9._~-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientName, balance, lines]
              properties:
                clientName: {type: string, maxLength: 250}
                balance: {$ref: '#/components/schemas/PaymentInputAmount'}
                lines:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {$ref: '#/components/schemas/InvoicePaymentLine'}
                notes: {type: string, nullable: true, maxLength: 500}
      responses:
        '201':
          description: Cobro registrado o respuesta histórica recuperada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoicePaymentResult'}
        '400':
          description: Solicitud, selector o clave inválida.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401': {description: JWT Bearer ausente o inválido.}
        '403':
          description: Permiso de escritura insuficiente.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: Factura inexistente en la empresa seleccionada.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: Factura no cobrable, datos desactualizados o conflicto de idempotencia.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503': {description: Autorización o admisión de cobros indisponible.}
        '504': {description: Tiempo de espera agotado. Reintentar con la misma clave y solicitud.}
components:
  parameters:
    InvoiceId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    InvoiceSearch:
      name: search
      in: query
      description: Coincidencia parcial por número de factura o nombre del cliente, sin distinguir mayúsculas.
      schema: {type: string, maxLength: 250}
    InvoiceStatus:
      name: status
      in: query
      description: Filtra por paymentStatus. ALL incluye las facturas anuladas en facturación.
      schema: {type: string, enum: [ALL, ISSUED, CANCELLED, PARTIALLY_PAID, PAID], default: ALL}
    InvoicePageNumber: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    InvoicePageSize: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    CompanySelector:
      name: X-Company-Id
      in: header
      required: true
      description: UUID de la empresa seleccionada para esta petición.
      schema: {type: string, format: uuid}
      example: e3fc1fd0-42ea-4a0d-9c14-6cbd44592b42
  responses:
    InvoiceDocument:
      description: Documento y estado actuales.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Invoice'}
    InvoicePage:
      description: Página de facturas en orden descendente de fecha e ID.
      content:
        application/json:
          schema:
            type: object
            required: [content, page, size, totalElements, totalPages]
            properties:
              content: {type: array, items: {$ref: '#/components/schemas/Invoice'}}
              page: {type: integer}
              size: {type: integer}
              totalElements: {type: integer, format: int64}
              totalPages: {type: integer, format: int64}
    InvoiceList:
      description: Facturas en el mismo orden que la consulta paginada.
      content:
        application/json:
          schema: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/Invoice'}}
    InvoiceListLimitExceeded:
      description: Más de 1000 facturas coinciden. Refine la búsqueda o use la ruta paginada.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {status: 422, errorCode: INVOICE_LIST_LIMIT_EXCEEDED}
    InvalidContext:
      description: Selector ausente, duplicado o inválido, o petición inválida.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    SalePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/ListedSale'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer, format: int64}
    ListedSale:
      allOf:
        - $ref: '#/components/schemas/SaleSummary'
        - type: object
          properties:
            invoiceNumber: {type: string, nullable: true, example: FAC-2026-001}
            paymentStatus: {$ref: '#/components/schemas/PaymentStatus'}
            outstandingBalance:
              allOf:
                - {$ref: '#/components/schemas/NullableAmount'}
              description: Saldo pendiente. Una obligación cancelada devuelve '0.00'.
            collectedAmount:
              allOf:
                - {$ref: '#/components/schemas/NullableAmount'}
              description: Importe original menos saldo histórico.
    SaleSummary:
      type: object
      required: [id, code, client, saleDate, mode, status, total, currency]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: V-2026-001}
        client: {$ref: '#/components/schemas/Party'}
        saleDate: {type: string, format: date}
        mode: {type: string, enum: [CASH, CREDIT]}
        status: {type: string, enum: [REGISTERED, CANCELLED]}
        total: {$ref: '#/components/schemas/Amount'}
        currency: {type: string, enum: [DOP]}
    SaleDetail:
      allOf:
        - $ref: '#/components/schemas/ListedSale'
        - type: object
          required: [lines]
          properties:
            lines: {type: array, items: {$ref: '#/components/schemas/Line'}}
            invoiceId: {type: string, format: uuid, nullable: true}
            dueDate: {type: string, format: date, nullable: true}
            cancellation:
              type: object
              required: [cancelledBy, cancelledAt, cancelReason]
              properties:
                cancelledBy: {type: string, format: uuid}
                cancelledAt: {type: string, format: date-time}
                cancelReason: {type: string}
    ReceivableDetail:
      type: object
      required: [id, client, origin, totalAmount, balance, outstandingBalance, collectedAmount, currency, dueDate, status]
      properties:
        id: {type: string, format: uuid}
        saleId: {type: string, format: uuid, nullable: true}
        saleCode: {type: string, nullable: true}
        invoiceId: {type: string, format: uuid, nullable: true}
        invoiceNumber: {type: string, nullable: true}
        client: {$ref: '#/components/schemas/Party'}
        origin: {type: string, enum: [SALE, OPENING_BALANCE]}
        totalAmount: {$ref: '#/components/schemas/Amount'}
        collectedAmount: {$ref: '#/components/schemas/Amount'}
        balance:
          allOf:
            - {$ref: '#/components/schemas/Amount'}
          description: Balance histórico, incluido el de una obligación cancelada.
        outstandingBalance:
          allOf:
            - {$ref: '#/components/schemas/Amount'}
          description: Saldo cobrable. Una obligación cancelada devuelve '0.00'.
        currency: {type: string, enum: [DOP]}
        dueDate: {type: string, format: date}
        status: {type: string, enum: [OPEN, PARTIALLY_PAID, PAID, CANCELLED]}
    PaymentStatus:
      type: string
      nullable: true
      enum: [OPEN, PARTIALLY_PAID, PAID, CANCELLED, null]
      description: OPEN equivale a ISSUED en facturación. Null si la venta no tiene factura ni obligación.
    NullableAmount:
      type: string
      nullable: true
      pattern: '^[0-9]+\.[0-9]{2}$'
    Invoice:
      type: object
      required: [id, number, saleId, documentType, fiscalClassification, status, issuedAt, saleDate, company, client, lines, total, currency]
      properties:
        id: {type: string, format: uuid}
        saleId: {type: string, format: uuid}
        number:
          type: string
          pattern: '^FAC-[0-9]{4}-[0-9]{3,19}$'
          example: FAC-2026-001
        documentType: {type: string, enum: [INTERNAL]}
        fiscalClassification: {type: string, enum: [NOT_FISCAL]}
        status: {type: string, enum: [ISSUED, CANCELLED]}
        issueDate: {type: string, format: date}
        mode: {type: string, enum: [CASH, CREDIT]}
        requestedReceiptType: {type: string, enum: [CONSUMPTION, FISCAL_CREDIT]}
        notes: {type: string}
        cancelledAt: {type: string, format: date-time}
        cancelledBy: {type: string, format: uuid}
        cancelReason: {type: string}
        paymentStatus:
          type: string
          enum: [ISSUED, PARTIALLY_PAID, PAID, CANCELLED]
          description: Clasificación de pago expuesta en las consultas de facturación y caja. ISSUED equivale a OPEN en ventas y cartera.
        outstandingBalance: {$ref: '#/components/schemas/Amount'}
        collectedAmount: {$ref: '#/components/schemas/Amount'}
        issuedAt: {type: string, format: date-time}
        saleDate: {type: string, format: date}
        company: {$ref: '#/components/schemas/Party'}
        client: {$ref: '#/components/schemas/Party'}
        lines:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Line'}
        total: {$ref: '#/components/schemas/Amount'}
        currency: {type: string, enum: [DOP]}
    Party:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Line:
      type: object
      required: [id, catalogItemId, itemName, unitPrice, quantity, subtotal]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador histórico de la línea de venta.
        catalogItemId: {type: string, format: uuid}
        itemName: {type: string}
        itemDescription: {type: string, nullable: true}
        unitPrice: {type: string, pattern: '^[0-9]+\.[0-9]{2,4}$'}
        quantity: {type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.001}
        subtotal: {$ref: '#/components/schemas/Amount'}
        discount: {$ref: '#/components/schemas/Amount'}
        taxRate: {type: string, example: '0.180000'}
        taxAmount: {$ref: '#/components/schemas/Amount'}
    Amount:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      example: '3500.00'
    PaymentInputAmount:
      oneOf:
        - {type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.01}
        - {type: string, example: '3500.00'}
    InvoicePaymentLine:
      type: object
      required: [method, amount]
      properties:
        method: {type: string, enum: [CASH, CREDIT_CARD, DEBIT_CARD, TRANSFER, CHECK]}
        amount: {$ref: '#/components/schemas/PaymentInputAmount'}
        reference: {type: string, nullable: true, maxLength: 250}
    InvoicePaymentResult:
      type: object
      required: [paymentId, invoiceId, receivableId, operatorId, shiftId, registeredAt, amount, balance, currency, lines]
      properties:
        paymentId: {type: string, format: uuid}
        invoiceId: {type: string, format: uuid}
        receivableId: {type: string, format: uuid}
        operatorId: {type: string, format: uuid}
        shiftId: {type: string, format: uuid}
        registeredAt: {type: string, format: date-time}
        amount: {type: number}
        balance: {type: number}
        currency: {type: string, enum: [DOP]}
        lines:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/InvoicePaymentLine'
              - type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
                  amount: {type: number}
        notes: {type: string, nullable: true}
    Problem:
      type: object
      required: [type, title, status, detail, errorCode, timestamp, traceId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errorCode: {type: string}
        timestamp: {type: string, format: date-time}
        traceId: {type: string}
        errors:
          type: object
          description: Mensajes de validación por campo o parámetro.
          additionalProperties: {type: string}

openapi: 3.0.3
info:
  title: SaniGest Sales
  version: '1.0'
security:
  - bearerAuth: []
paths:
  /api/v1/sales/options:
    get:
      summary: Consultar opciones de Sales
      description: Requiere SALES_READ. Los filtros de factura y cartera son opciones de UI. PENDING representa
        OPEN en cartera. El comprobante solicitado es distinto de la clasificación fiscal de la factura interna.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CompanySelector'
      responses:
        '200':
          description: Opciones disponibles
          content:
            application/json:
              schema:
                type: object
                required:
                - saleModes
                - requestedReceiptTypes
                - invoiceFilters
                - receivableFilters
                - paymentMethods
                properties:
                  saleModes:
                    type: array
                    items:
                      type: object
                      required:
                      - value
                      - label
                      properties:
                        value:
                          type: string
                          enum:
                          - CASH
                          - CREDIT
                        label:
                          type: string
                  requestedReceiptTypes:
                    type: array
                    items:
                      type: object
                      required:
                      - value
                      - label
                      properties:
                        value:
                          type: string
                          enum:
                          - CONSUMPTION
                          - FISCAL_CREDIT
                        label:
                          type: string
                  invoiceFilters:
                    type: array
                    items:
                      type: object
                      required:
                      - value
                      - label
                      properties:
                        value:
                          type: string
                          enum:
                          - ALL
                          - ISSUED
                          - PARTIALLY_PAID
                          - PAID
                        label:
                          type: string
                  receivableFilters:
                    type: array
                    items:
                      type: object
                      required:
                      - value
                      - label
                      properties:
                        value:
                          type: string
                          enum:
                          - ALL
                          - PENDING
                          - PARTIALLY_PAID
                        label:
                          type: string
                  paymentMethods:
                    type: array
                    items:
                      type: object
                      required:
                      - value
                      - label
                      properties:
                        value:
                          type: string
                          enum:
                          - CASH
                          - CREDIT_CARD
                          - DEBIT_CARD
                          - TRANSFER
                          - CHECK
                        label:
                          type: string
        '400':
          description: Parámetros inválidos
        '401':
          description: JWT inválido o ausente
        '403':
          description: Permiso empresarial insuficiente
        '503':
          description: Autorización no disponible
  /api/v1/sales:
    parameters:
      - $ref: '#/components/parameters/CompanySelector'
    get:
      summary: Lista ventas de la empresa con SALES_READ.
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 250}}
        - {name: status, in: query, schema: {type: string, enum: [REGISTERED, CANCELLED]}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SalePage'}
        '400': {$ref: '#/components/responses/InvalidContext'}
        '401': {description: JWT inválido o ausente.}
        '403': {description: Permiso empresarial insuficiente.}
        '404': {description: Recurso ausente o fuera de la empresa autorizada.}
        '503': {description: Autorización o dependencia indisponible.}
    post:
      summary: Registra una venta con SALES_WRITE e Idempotency-Key.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      responses:
        '201': {description: Operación completada.}
        '400': {$ref: '#/components/responses/InvalidContext'}
        '401': {description: JWT inválido o ausente.}
        '403': {description: Permiso empresarial insuficiente.}
        '404': {description: Recurso ausente o fuera de la empresa autorizada.}
        '503': {description: Autorización o dependencia indisponible.}
  /api/v1/sales/{id}:
    parameters:
      - $ref: '#/components/parameters/CompanySelector'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Consulta una venta con SALES_READ.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleDetail'}
        '400': {$ref: '#/components/responses/InvalidContext'}
        '401': {description: JWT inválido o ausente.}
        '403': {description: Permiso empresarial insuficiente.}
        '404': {description: Recurso ausente o fuera de la empresa autorizada.}
        '503': {description: Autorización o dependencia indisponible.}
  /api/v1/sales/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/CompanySelector'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Cancela una venta con SALES_CANCEL (OWNER o ADMIN).
      responses:
        '200': {description: Operación completada.}
        '400': {$ref: '#/components/responses/InvalidContext'}
        '401': {description: JWT inválido o ausente.}
        '403': {description: Permiso empresarial insuficiente.}
        '404': {description: Recurso ausente o fuera de la empresa autorizada.}
        '503': {description: Autorización o dependencia indisponible.}
  /api/v1/receivables/{id}:
    parameters:
      - $ref: '#/components/parameters/CompanySelector'
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Consulta una cuenta por cobrar con SALES_READ.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceivableDetail'}
        '400': {$ref: '#/components/responses/InvalidContext'}
        '401': {description: JWT inválido o ausente.}
        '403': {description: Permiso empresarial insuficiente.}
        '404': {description: Recurso ausente o fuera de la empresa autorizada.}
        '503': {description: Autorización o dependencia indisponible.}
  /api/v1/sales/{saleId}/invoices:
    post:
      operationId: issueInternalInvoice
      summary: Emite manualmente una factura interna desde una venta
      description: |
        Requiere membresía empresarial activa con SALES_WRITE. OWNER y ADMIN tienen
        acceso. OPERATOR requiere concesión explícita. Este flujo usa membresía regular.
        La solicitud debe enviarse sin cuerpo. Un reintento autenticado y autorizado con
        la misma venta y clave devuelve el mismo HTTP 201 y documento.
        El documento INTERNAL / NOT_FISCAL no genera NCF y no es un comprobante
        válido para la DGII. La emisión no genera cobros, ingresos ni movimientos de caja.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanySelector'
        - name: saleId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: true
          description: Una sola clave por empresa, usuario y operación. Reutilizarla para otra venta devuelve 409.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{1,128}$'
      responses:
        '201':
          description: Factura interna emitida o respuesta idempotente recuperada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invoice'}
        '400':
          description: Selector, UUID, clave o cuerpo inválido.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401':
          description: JWT Bearer ausente o inválido.
        '403':
          description: Permiso empresarial insuficiente.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: Venta inexistente o fuera de la empresa autorizada.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: Venta no elegible, factura vigente o clave usada para otra venta.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: Autorización o snapshot empresarial indisponible.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  parameters:
    CompanySelector:
      name: X-Company-Id
      in: header
      required: true
      description: UUID de la empresa seleccionada para esta petición.
      schema: {type: string, format: uuid}
      example: e3fc1fd0-42ea-4a0d-9c14-6cbd44592b42
  responses:
    InvalidContext:
      description: Selector ausente, duplicado o inválido, o petición inválida.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    SalePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/ListedSale'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer, format: int64}
    ListedSale:
      allOf:
        - $ref: '#/components/schemas/SaleSummary'
        - type: object
          properties:
            invoiceNumber: {type: string, nullable: true, example: FAC-2026-001}
            paymentStatus: {$ref: '#/components/schemas/PaymentStatus'}
    SaleSummary:
      type: object
      required: [id, code, client, saleDate, mode, status, total, currency]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: V-2026-001}
        client: {$ref: '#/components/schemas/Party'}
        saleDate: {type: string, format: date}
        mode: {type: string, enum: [CASH, CREDIT]}
        status: {type: string, enum: [REGISTERED, CANCELLED]}
        total: {$ref: '#/components/schemas/Amount'}
        currency: {type: string, enum: [DOP]}
    SaleDetail:
      allOf:
        - $ref: '#/components/schemas/ListedSale'
        - type: object
          required: [lines]
          properties:
            lines: {type: array, items: {$ref: '#/components/schemas/Line'}}
            invoiceId: {type: string, format: uuid, nullable: true}
            dueDate: {type: string, format: date, nullable: true}
            outstandingBalance:
              allOf:
                - {$ref: '#/components/schemas/NullableAmount'}
              description: Saldo cobrable. Una obligación cancelada devuelve '0.00'.
            collectedAmount:
              allOf:
                - {$ref: '#/components/schemas/NullableAmount'}
              description: Importe original menos balance histórico de la obligación.
            cancellation:
              type: object
              required: [cancelledBy, cancelledAt, cancelReason]
              properties:
                cancelledBy: {type: string, format: uuid}
                cancelledAt: {type: string, format: date-time}
                cancelReason: {type: string}
    ReceivableDetail:
      type: object
      required: [id, client, origin, totalAmount, balance, outstandingBalance, currency, dueDate, status]
      properties:
        id: {type: string, format: uuid}
        saleId: {type: string, format: uuid, nullable: true}
        saleCode: {type: string, nullable: true}
        invoiceId: {type: string, format: uuid, nullable: true}
        invoiceNumber: {type: string, nullable: true}
        client: {$ref: '#/components/schemas/Party'}
        origin: {type: string, enum: [SALE, OPENING_BALANCE]}
        totalAmount: {$ref: '#/components/schemas/Amount'}
        balance:
          allOf:
            - {$ref: '#/components/schemas/Amount'}
          description: Balance histórico, incluido el de una obligación cancelada.
        outstandingBalance:
          allOf:
            - {$ref: '#/components/schemas/Amount'}
          description: Saldo cobrable. Una obligación cancelada devuelve '0.00'.
        currency: {type: string, enum: [DOP]}
        dueDate: {type: string, format: date}
        status: {type: string, enum: [OPEN, PARTIALLY_PAID, PAID, CANCELLED]}
    PaymentStatus:
      type: string
      nullable: true
      enum: [OPEN, PARTIALLY_PAID, PAID, CANCELLED, null]
      description: Estado de la obligación vinculada. Null si no existe obligación.
    NullableAmount:
      type: string
      nullable: true
      pattern: '^[0-9]+\.[0-9]{2}$'
    Invoice:
      type: object
      required: [id, number, saleId, documentType, fiscalClassification, status, issuedAt, saleDate, company, client, lines, total, currency]
      properties:
        id: {type: string, format: uuid}
        saleId: {type: string, format: uuid}
        number:
          type: string
          pattern: '^FAC-[0-9]{4}-[0-9]{3,19}$'
          example: FAC-2026-001
        documentType: {type: string, enum: [INTERNAL]}
        fiscalClassification: {type: string, enum: [NOT_FISCAL]}
        status: {type: string, enum: [ISSUED]}
        issuedAt: {type: string, format: date-time}
        saleDate: {type: string, format: date}
        company: {$ref: '#/components/schemas/Party'}
        client: {$ref: '#/components/schemas/Party'}
        lines:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Line'}
        total: {$ref: '#/components/schemas/Amount'}
        currency: {type: string, enum: [DOP]}
    Party:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Line:
      type: object
      required: [id, catalogItemId, itemName, unitPrice, quantity, subtotal]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador histórico de la línea de venta.
        catalogItemId: {type: string, format: uuid}
        itemName: {type: string}
        itemDescription: {type: string, nullable: true}
        unitPrice: {$ref: '#/components/schemas/Amount'}
        quantity: {type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.001}
        subtotal: {$ref: '#/components/schemas/Amount'}
    Amount:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      example: '3500.00'
    Problem:
      type: object
      required: [type, title, status, detail, errorCode, timestamp, traceId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errorCode: {type: string}
        timestamp: {type: string, format: date-time}
        traceId: {type: string}
        errors:
          type: object
          description: Mensajes de validación por campo o parámetro.
          additionalProperties: {type: string}

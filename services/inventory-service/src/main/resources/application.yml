spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${INVENTORY_DB_HOST}:${INVENTORY_DB_PORT:5432}/sanigest_inventory
    username: sanigest_inventory
    password: ${INVENTORY_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      data-source-properties:
        logServerErrorDetail: false
        options: "-c lock_timeout=3000"
      connection-init-sql: >-
        DO $inventory$
        BEGIN
          IF current_database() <> 'sanigest_inventory' OR session_user <> 'sanigest_inventory'
             OR current_user <> 'sanigest_inventory' THEN
            RAISE EXCEPTION 'Inventory requires the sanigest_inventory database and role';
          END IF;
        END;
        $inventory$;
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: inventory
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    read:
      strict-duplicate-detection: true
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  port: ${SERVER_PORT:${INVENTORY_SERVICE_PORT:8086}}
  shutdown: graceful

sanigest:
  company-access:
    origin: ${INVENTORY_COMPANY_ACCESS_ORIGIN:}
    issuer: ${INVENTORY_COMPANY_ACCESS_ISSUER:inventory-company-access}
    private-key-location: ${INVENTORY_COMPANY_ACCESS_PRIVATE_KEY_LOCATION:}
    connect-timeout: ${INVENTORY_COMPANY_ACCESS_CONNECT_TIMEOUT:500ms}
    response-timeout: ${INVENTORY_COMPANY_ACCESS_RESPONSE_TIMEOUT:2s}
  catalog:
    origin: ${INVENTORY_CATALOG_ORIGIN:}
    connect-timeout: ${INVENTORY_CATALOG_CONNECT_TIMEOUT:500ms}
    response-timeout: ${INVENTORY_CATALOG_RESPONSE_TIMEOUT:2s}
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    public-key: ${JWT_PUBLIC_KEY_LOCATION}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${SANIGEST_OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  swagger-ui:
    enabled: ${SANIGEST_OPENAPI_ENABLED:false}
    disable-swagger-default-url: true
  paths-to-match: /api/v1/**
  override-with-generic-response: false

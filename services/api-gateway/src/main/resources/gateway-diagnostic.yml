spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/v1/gateway/ping]':
                allowed-origins:
                  - http://localhost:3000
                  - http://127.0.0.1:3000
                allowed-methods: [GET, OPTIONS]
                allowed-headers: [Accept, Content-Type]
                exposed-headers: [X-Correlation-Id]
                allow-credentials: false
          routes:
            - id: diagnostic-ping
              uri: ${GATEWAY_TEST_BACKEND_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/v1/gateway/ping
                - Method=GET
              filters:
                - SetPath=/ping
                - RemoveRequestHeader=Authorization
                - RemoveRequestHeader=Cookie
                - RemoveRequestHeader=X-Trace-Id
                - RemoveRequestHeader=traceparent
                - RemoveRequestHeader=tracestate
                - RemoveRequestHeader=baggage
                - RemoveResponseHeader=Set-Cookie

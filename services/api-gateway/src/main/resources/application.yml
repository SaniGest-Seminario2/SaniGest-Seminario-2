spring:
  application:
    name: api-gateway
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-exception: false
      include-binding-errors: never
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 500
            response-timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never

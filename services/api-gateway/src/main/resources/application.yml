spring:
  application:
    name: api-gateway
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-exception: false
      include-binding-errors: never
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 500
            response-timeout: 2s
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/v1/{resource:auth|users|companies|invitations|clients|suppliers|catalog-items}/**]':
                allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Accept, Authorization, Content-Type, Idempotency-Key]
                exposed-headers: [X-Correlation-Id]
                allow-credentials: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never

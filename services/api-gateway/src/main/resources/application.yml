spring:
  application:
    name: api-gateway
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-exception: false
      include-binding-errors: never
  cloud:
    gateway:
      server:
        webflux:
          httpserver:
            wiretap: false
          metrics:
            tags:
              path:
                enabled: false
          httpclient:
            wiretap: false
            connect-timeout: 500
            response-timeout: 2s
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/v1/{resource:auth|users|companies|advisor|invitations|clients|suppliers|catalog-items|sales|receivables|warehouses|inventory|expenses|payables|dashboard|reports}/**]':
                allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Accept, Authorization, Content-Type, Idempotency-Key, X-Company-Id]
                exposed-headers: [X-Correlation-Id]
                allow-credentials: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never

springdoc:
  api-docs:
    enabled: ${SANIGEST_OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  swagger-ui:
    enabled: ${SANIGEST_OPENAPI_ENABLED:false}
    disable-swagger-default-url: true
    urls:
      - name: Gateway
        url: /v3/api-docs
      - name: Identity
        url: /v3/api-docs/identity
      - name: Company
        url: /v3/api-docs/company
      - name: Catalog
        url: /v3/api-docs/catalog
      - name: Inventory
        url: /v3/api-docs/inventory
      - name: Sales
        url: /v3/api-docs/sales
      - name: Expense
        url: /v3/api-docs/expense
      - name: Finance
        url: /v3/api-docs/finance
  paths-to-match: /api/v1/**
  override-with-generic-response: false

openapi: 3.1.0
info:
  title: SaniGest Expense API
  version: 0.1.0
paths:
  /api/v1/expenses/options:
    get:
      operationId: expenseOptions
      summary: Consultar opciones de compras y cuentas por pagar
      description: >
        Requiere permiso de lectura en Expense. operationTypeFilters y statusFilters se usan
        en las consultas de gastos. payableFilters se usa como status en cuentas por pagar.
        ALL es exclusivo de filtros. taxClassifications usa los códigos de taxClassification del alta.
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: X-Company-Id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Grupos de opciones ordenados
          content:
            application/json:
              schema:
                type: object
                required: [operationTypes, receiptTypes, modes, receiptStatuses, taxClassifications, operationTypeFilters, statusFilters, payableFilters]
                properties:
                  operationTypes:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [PURCHASE, OPERATING_EXPENSE, ASSET_ACQUISITION]}
                        label: {type: string}
                  receiptTypes:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [FISCAL_CREDIT, CONSUMPTION, PURCHASE, MINOR_EXPENSES, OTHER, NOT_APPLICABLE]}
                        label: {type: string}
                  modes:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [CASH, CREDIT]}
                        label: {type: string}
                  receiptStatuses:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [PENDING, COMPLETE, PARTIAL]}
                        label: {type: string}
                  taxClassifications:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [ITBIS_18, ITBIS_16, EXEMPT]}
                        label: {type: string}
                  operationTypeFilters:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [ALL, PURCHASE, OPERATING_EXPENSE, ASSET_ACQUISITION]}
                        label: {type: string}
                  statusFilters:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [ALL, PAID, PENDING, PARTIALLY_PAID]}
                        label: {type: string}
                  payableFilters:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: {type: string, enum: [ALL, PENDING, PARTIALLY_PAID]}
                        label: {type: string}
              example:
                operationTypes:
                  - {value: PURCHASE, label: "Compra de mercancía o suministro"}
                  - {value: OPERATING_EXPENSE, label: "Gasto operativo"}
                  - {value: ASSET_ACQUISITION, label: "Adquisición de activo"}
                receiptTypes:
                  - {value: FISCAL_CREDIT, label: "Crédito fiscal"}
                  - {value: CONSUMPTION, label: "Consumo"}
                  - {value: PURCHASE, label: "Compra"}
                  - {value: MINOR_EXPENSES, label: "Gastos menores"}
                  - {value: OTHER, label: "Otro"}
                  - {value: NOT_APPLICABLE, label: "No aplica"}
                modes:
                  - {value: CASH, label: "Contado"}
                  - {value: CREDIT, label: "Crédito"}
                receiptStatuses:
                  - {value: PENDING, label: "Pendiente de recepción"}
                  - {value: COMPLETE, label: "Recibida completamente"}
                  - {value: PARTIAL, label: "Recibida parcialmente"}
                taxClassifications:
                  - {value: ITBIS_18, label: "18%"}
                  - {value: ITBIS_16, label: "16%"}
                  - {value: EXEMPT, label: "0%/Exento"}
                operationTypeFilters:
                  - {value: ALL, label: "Todas"}
                  - {value: PURCHASE, label: "Compra"}
                  - {value: OPERATING_EXPENSE, label: "Gasto"}
                  - {value: ASSET_ACQUISITION, label: "Activo"}
                statusFilters:
                  - {value: ALL, label: "Todos"}
                  - {value: PAID, label: "Pagado"}
                  - {value: PENDING, label: "Pendiente"}
                  - {value: PARTIALLY_PAID, label: "Parcial"}
                payableFilters:
                  - {value: ALL, label: "Todos"}
                  - {value: PENDING, label: "Pendiente"}
                  - {value: PARTIALLY_PAID, label: "Parcial"}
  /api/v1/expenses:
    post:
      operationId: registerExpense
      summary: Registrar una compra, gasto operativo o adquisición de activo
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: X-Company-Id
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: Idempotency-Key
          required: true
          description: Reutilizar con el mismo usuario, empresa y cuerpo al reintentar.
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Registration'}
      responses:
        '201':
          description: Documento registrado o reproducido con la misma clave.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '400': {description: Empresa, referencia comercial, recepción o valor inválido.}
        '401': {description: Autenticación requerida.}
        '403': {description: Membresía o permiso insuficiente.}
        '409': {description: La clave ya fue usada con un cuerpo diferente.}
        '503': {description: Dependencia indisponible. Si hay recepción pendiente de sincronizar, reintentar con la misma clave.}
        '504': {description: Tiempo de espera del Gateway agotado. Reintentar con la misma clave.}
  /api/v1/payables:
    get:
      operationId: listPayables
      summary: Listar cartera abierta paginada
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PayableCompany'
        - $ref: '#/components/parameters/PayableSearch'
        - $ref: '#/components/parameters/PayableStatus'
        - $ref: '#/components/parameters/PayableSupplier'
        - in: query
          name: page
          schema: {type: integer, minimum: 0, default: 0}
        - in: query
          name: size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Obligaciones con saldo positivo ordenadas por vencimiento e ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PayablePage'}
        '400': {description: Empresa o parámetros inválidos.}
        '401': {description: Autenticación requerida.}
        '403': {description: Membresía o permiso EXPENSE_READ insuficiente.}
        '503': {description: Servicio de autorización indisponible.}
  /api/v1/payables/{id}/payments:
    post:
      operationId: registerPayablePayment
      summary: Abonar o liquidar una cuenta por pagar
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PayableCompany'
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: Idempotency-Key
          required: true
          description: Reutilizar con la misma empresa, usuario, obligación y cuerpo al reintentar.
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PayablePaymentRequest'}
      responses:
        '201':
          description: Pago registrado o reproducido con la misma clave.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PayablePaymentDetails'
                  - type: object
                    required: [paymentId, payableId, actorId, registeredAt, outstandingAmount, status]
                    properties:
                      paymentId: {type: string, format: uuid}
                      payableId: {type: string, format: uuid}
                      actorId: {type: string, format: uuid}
                      registeredAt: {type: string, format: date-time}
                      outstandingAmount: {type: number, minimum: 0, multipleOf: 0.01}
                      status: {type: string, enum: [PARTIALLY_PAID, PAID]}
        '400': {description: Solicitud inválida o cuenta no elegible en Finance.}
        '401': {description: Autenticación requerida.}
        '403': {description: Permiso de escritura de Expense insuficiente.}
        '404': {description: Obligación inexistente en la empresa seleccionada.}
        '409': {description: Obligación anulada, saldo insuficiente o clave reutilizada con otro pago.}
        '503': {description: Autorización o validación de cuenta indisponible.}
        '504': {description: Tiempo de espera del Gateway agotado. Reintentar con la misma clave.}
  /api/v1/payables/all:
    get:
      operationId: listAllPayables
      summary: Listar toda la cartera abierta
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PayableCompany'
        - $ref: '#/components/parameters/PayableSearch'
        - $ref: '#/components/parameters/PayableStatus'
        - $ref: '#/components/parameters/PayableSupplier'
      responses:
        '200':
          description: Obligaciones con saldo positivo ordenadas por vencimiento e ID.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Payable'}}
        '400': {description: Empresa o parámetros inválidos.}
        '401': {description: Autenticación requerida.}
        '403': {description: Membresía o permiso EXPENSE_READ insuficiente.}
        '503': {description: Servicio de autorización indisponible.}
  /api/v1/payables/supplier-balances:
    get:
      operationId: listSupplierBalances
      summary: Consultar saldos de proveedores por lote
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PayableCompany'
        - in: query
          name: supplierIds
          required: true
          description: Identificadores solicitados. Cada UUID se devuelve una vez, con saldo cero si no tiene obligaciones abiertas en la empresa.
          schema: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Saldos ordenados por UUID de proveedor.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SupplierBalance'}}
        '400': {description: Empresa o parámetros inválidos.}
        '401': {description: Autenticación requerida.}
        '403': {description: Membresía o permiso EXPENSE_READ insuficiente.}
        '503': {description: Servicio de autorización indisponible.}
components:
  parameters:
    PayableCompany:
      in: header
      name: X-Company-Id
      required: true
      schema: {type: string, format: uuid}
    PayableSearch:
      in: query
      name: search
      description: Coincidencia parcial por proveedor, nombres de artículos o factura del proveedor.
      schema: {type: string, maxLength: 200}
    PayableStatus:
      in: query
      name: status
      description: PENDING selecciona obligaciones OPEN.
      schema: {enum: [ALL, PENDING, PARTIALLY_PAID], default: ALL}
    PayableSupplier:
      in: query
      name: supplierId
      schema: {type: string, format: uuid}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    PayablePaymentRequest:
      allOf:
        - $ref: '#/components/schemas/PayablePaymentDetails'
        - type: object
          properties:
            amount:
              oneOf:
                - {type: number, exclusiveMinimum: 0, multipleOf: 0.01, maximum: 99999999999999999.99}
                - {type: string, pattern: '^[0-9]{1,17}(\.[0-9]{1,2})?$'}
    PayablePaymentDetails:
      type: object
      required: [amount, method, accountId, date]
      properties:
        amount: {type: [number, string], description: Importe positivo en DOP con hasta dos decimales.}
        method: {type: string, enum: [CASH, CREDIT_CARD, DEBIT_CARD, TRANSFER, CHECK]}
        accountId:
          type: string
          format: uuid
          description: Cuenta de la empresa habilitada para el medio en Finance.
        date:
          type: string
          format: date
          description: Fecha efectiva del pago, hasta el día actual en America/Santo_Domingo.
        reference:
          type: [string, 'null']
          maxLength: 250
          description: Requerida para los medios distintos de CASH. Omitir para CASH.
        notes: {type: [string, 'null'], maxLength: 500}
    Payable:
      type: object
      required: [id, supplierId, supplierName, concept, dueDate, originalAmount, paidAmount, outstandingAmount, status]
      properties:
        id: {type: string, format: uuid, description: ID del documento que originó la obligación.}
        supplierId: {type: string, format: uuid}
        supplierName: {type: [string, 'null']}
        concept: {type: [string, 'null'], description: Nombres de artículos guardados en el documento, cuando estén disponibles.}
        dueDate: {type: string, format: date}
        originalAmount: {type: number}
        paidAmount: {type: number}
        outstandingAmount: {type: number}
        status: {enum: [OPEN, PARTIALLY_PAID]}
    PayablePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/Payable'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
    SupplierBalance:
      type: object
      required: [supplierId, outstandingAmount]
      properties:
        supplierId: {type: string, format: uuid}
        outstandingAmount: {type: number}
    Decimal:
      description: Decimal en DOP para importes. Se aceptan números o cadenas decimales en el alta.
      oneOf:
        - {type: number}
        - {type: string, pattern: '^[0-9]+(\.[0-9]+)?$'}
    OperationType:
      enum: [PURCHASE, OPERATING_EXPENSE, ASSET_ACQUISITION]
    ReceiptType:
      enum: [FISCAL_CREDIT, CONSUMPTION, PURCHASE, MINOR_EXPENSES, OTHER, NOT_APPLICABLE]
    ReceiptStatus:
      enum: [PENDING, COMPLETE, PARTIAL]
    Registration:
      type: object
      required: [operationType, documentDate, receiptType, mode, supplierId, supplierInvoiceNumber, receiptStatus, lines]
      properties:
        operationType: {$ref: '#/components/schemas/OperationType'}
        documentDate: {type: string, format: date}
        receiptType: {$ref: '#/components/schemas/ReceiptType'}
        mode: {enum: [CASH, CREDIT]}
        supplierId: {type: string, format: uuid}
        supplierInvoiceNumber: {type: string, minLength: 1, maxLength: 100}
        warehouseId:
          type: [string, 'null']
          format: uuid
          description: Requerido cuando el documento incluye productos.
        receiptStatus: {$ref: '#/components/schemas/ReceiptStatus'}
        ncf: {type: [string, 'null'], maxLength: 30}
        attachmentId: {type: [string, 'null'], format: uuid}
        notes: {type: [string, 'null'], maxLength: 1000}
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/Line'}
    Line:
      type: object
      required: [itemId, quantity, unitCost, taxClassification]
      properties:
        itemId: {type: string, format: uuid}
        quantity: {$ref: '#/components/schemas/Decimal'}
        unitCost: {$ref: '#/components/schemas/Decimal'}
        taxClassification: {enum: [ITBIS_18, ITBIS_16, EXEMPT]}
        discount:
          $ref: '#/components/schemas/Decimal'
          default: 0
        receivedQuantity:
          $ref: '#/components/schemas/Decimal'
          description: Si se omite, se toma la cantidad completa para COMPLETE o cero para PENDING y PARTIAL.
    Document:
      allOf:
        - $ref: '#/components/schemas/Registration'
        - type: object
          required: [id, companyId, supplierName, subtotal, tax, total, financialStatus]
          properties:
            id: {type: string, format: uuid}
            companyId: {type: string, format: uuid}
            supplierName: {type: string}
            subtotal: {type: number}
            tax: {type: number}
            total: {type: number}
            dueDate: {type: [string, 'null'], format: date}
            financialStatus: {enum: [OPEN, PAYMENT_UNRECORDED, NO_BALANCE]}
            lines:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Line'
                  - type: object
                    required: [id, itemName, stockTracked, subtotal, tax, total]
                    properties:
                      id: {type: string, format: uuid}
                      itemName: {type: string}
                      stockTracked: {type: boolean}
                      subtotal: {type: number}
                      tax: {type: number}
                      total: {type: number}

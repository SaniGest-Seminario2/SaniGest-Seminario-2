spring:
  application:
    name: expense-service
  datasource:
    url: jdbc:postgresql://${EXPENSE_DB_HOST}:${EXPENSE_DB_PORT:5432}/sanigest_expense
    username: sanigest_expense
    password: ${EXPENSE_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      data-source-properties:
        logServerErrorDetail: false
        options: "-c lock_timeout=3000"
      connection-init-sql: >-
        DO $expense$
        BEGIN
          IF current_database() <> 'sanigest_expense' OR session_user <> 'sanigest_expense'
             OR current_user <> 'sanigest_expense' THEN
            RAISE EXCEPTION 'Expense requires the sanigest_expense database and role';
          END IF;
        END;
        $expense$;
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  port: ${SERVER_PORT:${EXPENSE_SERVICE_PORT:8087}}
  shutdown: graceful

sanigest:
  payment-outbox:
    owner: expense
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    public-key: ${JWT_PUBLIC_KEY_LOCATION}

  company-access:
    enabled: ${EXPENSE_COMPANY_ACCESS_ENABLED:false}
    origin: ${EXPENSE_COMPANY_ACCESS_ORIGIN:}
    issuer: ${EXPENSE_COMPANY_ACCESS_ISSUER:expense-company-access}
    private-key-location: ${EXPENSE_COMPANY_ACCESS_PRIVATE_KEY_LOCATION:}
  finance-origin: ${EXPENSE_FINANCE_ORIGIN:http://finance-service:8080}
  finance-admission-token: ${FINANCE_ADMISSION_TOKEN:}
  catalog-origin: ${EXPENSE_CATALOG_ORIGIN:http://catalog-service:8080}
  inventory-origin: ${EXPENSE_INVENTORY_ORIGIN:http://inventory-service:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${SANIGEST_OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  swagger-ui:
    enabled: ${SANIGEST_OPENAPI_ENABLED:false}
    disable-swagger-default-url: true
  paths-to-match: /api/v1/**
  override-with-generic-response: false

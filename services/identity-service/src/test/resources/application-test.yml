spring:
  datasource:
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  flyway:
    clean-disabled: true

sanigest:
  jwt:
    private-key: classpath:jwt-test-private.pem
    public-key: classpath:jwt-test-public.pem
    issuer: sanigest-test
    audience: sanigest-api-test
    access-token-ttl: PT5M
    refresh-token-ttl: PT30M

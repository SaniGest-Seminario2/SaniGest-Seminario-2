spring:
  application:
    name: finance-service
  datasource:
    url: jdbc:postgresql://${FINANCE_DB_HOST}:${FINANCE_DB_PORT:5432}/sanigest_finance
    username: sanigest_finance
    password: ${FINANCE_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      data-source-properties:
        logServerErrorDetail: false
        options: "-c lock_timeout=3000"
      connection-init-sql: >-
        DO $finance$
        BEGIN
          IF current_database() <> 'sanigest_finance' OR session_user <> 'sanigest_finance'
             OR current_user <> 'sanigest_finance' THEN
            RAISE EXCEPTION 'Finance requires the sanigest_finance database and role';
          END IF;
        END;
        $finance$;
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: finance.cash-movements.v1
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 6000
    listener:
      ack-mode: record
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  port: ${SERVER_PORT:${FINANCE_SERVICE_PORT:8088}}
  shutdown: graceful

sanigest:
  finance:
    sales-origin: ${FINANCE_SALES_ORIGIN:http://localhost:8084}
    source-timeout: ${FINANCE_SOURCE_TIMEOUT:2s}
    expense-origin: ${FINANCE_EXPENSE_ORIGIN:http://localhost:8087}
    admission-token: ${FINANCE_ADMISSION_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${SANIGEST_OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  swagger-ui:
    enabled: ${SANIGEST_OPENAPI_ENABLED:false}
    disable-swagger-default-url: true
  paths-to-match: /api/v1/**
  override-with-generic-response: false

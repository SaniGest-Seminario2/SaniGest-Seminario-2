spring:
  datasource:
    url: jdbc:h2:mem:company;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  flyway:
    clean-disabled: true

server:
  tomcat:
    accesslog:
      enabled: true
      directory: /dev/stdout
      prefix: ""
      suffix: ""
      file-date-format: ""
      pattern: "%{yyyy-MM-dd'T'HH:mm:ss.SSS'Z'}t %m %U -> %s (%D ms)"
      buffered: false


spring:
  datasource:
    url: jdbc:h2:mem:company;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  flyway:
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,configprops
  endpoint:
    env:
      enabled: false
    configprops:
      enabled: false

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG

sanigest:
  jwt:
    issuer: sanigest-test
    audience: sanigest-api-test
    secret: test-secret-test-secret-test-secret-32


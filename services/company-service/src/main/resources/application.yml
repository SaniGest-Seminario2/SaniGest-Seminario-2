spring:
  application:
    name: company-service
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/{vendor}
    validate-migration-naming: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    accesslog:
      enabled: false

sanigest:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    public-key: ${JWT_PUBLIC_KEY_LOCATION}
  company:
    multiple-memberships-enabled: ${COMPANY_MULTIPLE_MEMBERSHIPS_ENABLED:false}
  identity-url: ${IDENTITY_SERVICE_URL}
  member-directory:
    issuer: ${MEMBER_DIRECTORY_ISSUER:}
    private-key-location: ${MEMBER_DIRECTORY_PRIVATE_KEY_LOCATION:}
  advisor-eligibility:
    issuer: ${ADVISOR_ELIGIBILITY_ISSUER:}
    private-key-location: ${ADVISOR_ELIGIBILITY_PRIVATE_KEY_LOCATION:}
  invitations:
    ttl: ${COMPANY_INVITATION_TTL:PT72H}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
  info:
    env:
      enabled: false
    git:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: "!local & !test"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

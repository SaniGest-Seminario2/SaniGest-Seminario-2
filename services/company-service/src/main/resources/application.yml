spring:
  application:
    name: company-service
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: none

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
  info:
    env:
      enabled: false
    git:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false

spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${COMPANY_DB_NAME:sanigest_company}
    username: ${COMPANY_DB_USER:sanigest_company}
    password: ${COMPANY_DB_PASSWORD}

name: sanigest

services:
  postgres:
    image: postgres:17.7-alpine
    profiles: [infra, apps]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-sanigest_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Define IDENTITY_DB_PASSWORD in .env}
      COMPANY_DB_PASSWORD: ${COMPANY_DB_PASSWORD:?Define COMPANY_DB_PASSWORD in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Define CATALOG_DB_PASSWORD in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Define INVENTORY_DB_PASSWORD in .env}
      SALES_DB_PASSWORD: ${SALES_DB_PASSWORD:?Define SALES_DB_PASSWORD in .env}
      EXPENSE_DB_PASSWORD: ${EXPENSE_DB_PASSWORD:?Define EXPENSE_DB_PASSWORD in .env}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Define FINANCE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - sanigest-local

  valkey:
    image: valkey/valkey:8.1.11-alpine
    profiles: [infra, apps]
    environment:
      VALKEY_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:?Define SPRING_DATA_REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --save "" --appendonly no
    ports:
      - "127.0.0.1:${SPRING_DATA_REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli --no-auth-warning -a "$$VALKEY_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - sanigest-local

  kafka:
    image: apache/kafka:4.1.1
    profiles: [infra, apps]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - sanigest-local

  company-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: company-service
    image: sanigest/company-service:${SANIGEST_IMAGE_TAG:-local}
    profiles: [apps]
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_APPLICATION_JSON: >-
        {"sanigest":{"company-access":{"callers":{"catalog":{"issuer":"catalog-company-access","public-key":"file:/run/secrets/catalog-company-public.pem"},
        "inventory":{"issuer":"inventory-company-access","public-key":"file:/run/secrets/inventory-company-public.pem"}}}}}
      JWT_ISSUER: ${JWT_ISSUER:-sanigest}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sanigest-api}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt-public.pem
      IDENTITY_SERVICE_URL: http://identity-service:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${COMPANY_DB_NAME:-sanigest_company}
      SPRING_DATASOURCE_USERNAME: ${COMPANY_DB_USER:-sanigest_company}
      SPRING_DATASOURCE_PASSWORD: ${COMPANY_DB_PASSWORD:?Define COMPANY_DB_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:?Define SPRING_DATA_REDIS_PASSWORD in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-5m}
    volumes:
      - type: bind
        source: ${COMPANY_ACCESS_KEYS_DIR:-./.secrets}/catalog-company-public.pem
        target: /run/secrets/catalog-company-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COMPANY_ACCESS_KEYS_DIR:-./.secrets}/inventory-company-public.pem
        target: /run/secrets/inventory-company-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JWT_PUBLIC_KEY_FILE:-./.secrets/jwt-public.pem}
        target: /run/secrets/jwt-public.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${COMPANY_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - sanigest-local

  identity-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: identity-service
    image: sanigest/identity-service:${SANIGEST_IMAGE_TAG:-local}
    profiles: [apps]
    environment:
      SPRING_PROFILES_ACTIVE: local
      JWT_ISSUER: ${JWT_ISSUER:-sanigest}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sanigest-api}
      JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt-public.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${IDENTITY_DB_NAME:-sanigest_identity}
      SPRING_DATASOURCE_USERNAME: ${IDENTITY_DB_USER:-sanigest_identity}
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD:?Define IDENTITY_DB_PASSWORD in .env}
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEY_FILE:-./.secrets/jwt-public.pem}
        target: /run/secrets/jwt-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JWT_PRIVATE_KEY_FILE:-./.secrets/jwt-private.pem}
        target: /run/secrets/jwt-private.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${IDENTITY_SERVICE_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - sanigest-local

  catalog-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: catalog-service
    image: sanigest/catalog-service:${SANIGEST_IMAGE_TAG:-local}
    profiles: [apps]
    environment:
      SPRING_PROFILES_ACTIVE: local
      JWT_ISSUER: ${JWT_ISSUER:-sanigest}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sanigest-api}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt-public.pem
      SERVER_PORT: 8080
      SPRING_APPLICATION_JSON: >-
        {"sanigest":{"company-access":{"enabled":true,"origin":"http://company-service:8080",
        "issuer":"catalog-company-access","private-key-location":"file:/run/secrets/catalog-company-private.pem"}}}
      CATALOG_DB_HOST: postgres
      CATALOG_INVENTORY_ORIGIN: ${CATALOG_INVENTORY_ORIGIN:-http://inventory-service:8080}
      CATALOG_DB_PORT: 5432
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Define CATALOG_DB_PASSWORD in .env}
    volumes:
      - type: bind
        source: ${COMPANY_ACCESS_KEYS_DIR:-./.secrets}/catalog-company-private.pem
        target: /run/secrets/catalog-company-private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JWT_PUBLIC_KEY_FILE:-./.secrets/jwt-public.pem}
        target: /run/secrets/jwt-public.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${CATALOG_SERVICE_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - sanigest-local

  sales-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: sales-service
    image: sanigest/sales-service:${SANIGEST_IMAGE_TAG:-local}
    profiles: [apps]
    environment:
      SPRING_PROFILES_ACTIVE: local
      JWT_ISSUER: ${JWT_ISSUER:-sanigest}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sanigest-api}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt-public.pem
      SERVER_PORT: 8080
      SALES_CATALOG_ORIGIN: ${SALES_CATALOG_ORIGIN:-http://catalog-service:8080}
      SALES_DB_HOST: postgres
      SALES_DB_PORT: 5432
      SALES_DB_PASSWORD: ${SALES_DB_PASSWORD:?Define SALES_DB_PASSWORD in .env}
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEY_FILE:-./.secrets/jwt-public.pem}
        target: /run/secrets/jwt-public.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${SALES_SERVICE_PORT:-8084}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - sanigest-local

  inventory-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: inventory-service
    image: sanigest/inventory-service:${SANIGEST_IMAGE_TAG:-local}
    profiles: [apps]
    environment:
      SPRING_PROFILES_ACTIVE: local
      JWT_ISSUER: ${JWT_ISSUER:-sanigest}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sanigest-api}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt-public.pem
      SERVER_PORT: 8080
      INVENTORY_CATALOG_ORIGIN: ${INVENTORY_CATALOG_ORIGIN:-http://catalog-service:8080}
      INVENTORY_COMPANY_ACCESS_ORIGIN: http://company-service:8080
      INVENTORY_COMPANY_ACCESS_PRIVATE_KEY_LOCATION: file:/run/secrets/inventory-company-private.pem
      INVENTORY_DB_HOST: postgres
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Define INVENTORY_DB_PASSWORD in .env}
    volumes:
      - type: bind
        source: ${COMPANY_ACCESS_KEYS_DIR:-./.secrets}/inventory-company-private.pem
        target: /run/secrets/inventory-company-private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JWT_PUBLIC_KEY_FILE:-./.secrets/jwt-public.pem}
        target: /run/secrets/jwt-public.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${INVENTORY_SERVICE_PORT:-8086}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      company-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - sanigest-local

volumes:
  postgres-data:
  kafka-data:

networks:
  sanigest-local:
    name: ${SANIGEST_NETWORK_NAME:-sanigest-local}
    internal: ${SANIGEST_NETWORK_INTERNAL:-true}


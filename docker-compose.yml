name: sanigest

services:
  company-postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sanigest_company}
      POSTGRES_USER: ${POSTGRES_USER:-sanigest_company}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - company-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - sanigest-local

  valkey:
    image: valkey/valkey:8.1.11-alpine
    environment:
      VALKEY_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:?Define SPRING_DATA_REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --save "" --appendonly no
    ports:
      - "127.0.0.1:${SPRING_DATA_REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli --no-auth-warning -a "$$VALKEY_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - sanigest-local

volumes:
  company-postgres-data:

networks:
  sanigest-local:
    name: ${SANIGEST_NETWORK_NAME:-sanigest-local}


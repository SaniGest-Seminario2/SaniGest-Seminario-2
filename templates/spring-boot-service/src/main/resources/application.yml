spring:
  application:
    name: spring-boot-service-template
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
  info:
    env:
      enabled: false
    git:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: "!local & !test"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
